<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Request unavailable | Jojo</title>
    <style>
        :root {
            color-scheme: light;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
        }

        main {
            width: min(32rem, calc(100% - 3rem));
            padding: 2.5rem;
            border: 1px solid #dce2ec;
            border-radius: 1rem;
            background: #fff;
            box-shadow: 0 1rem 3rem rgb(23 32 51 / 8%);
        }

        h1 {
            margin: 0 0 0.75rem;
            font-size: clamp(1.75rem, 5vw, 2.25rem);
        }

        p {
            margin: 0 0 1.5rem;
            line-height: 1.6;
            color: #536078;
        }

        a {
            color: #2457d6;
            font-weight: 650;
        }

        a:focus-visible {
            outline: 3px solid #8bb4ff;
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <main>
        <h1>This request is unavailable.</h1>
        <p>Please return to Jojo and try again. If the problem continues, contact your administrator.</p>
        <a href="/">Return to Jojo</a>
    </main>
</body>
</html>
