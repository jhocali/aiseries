name: Build and release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

env:
  BOXLANG_VERSION: "1.14.0"
  BOXLANG_CFENGINE: boxlang@1.14.0
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    name: Quality review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out review inputs
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up CommandBox
        uses: Ortus-Solutions/setup-commandbox@v2.0.1
        with:
          version: 6.3.1

      - name: Install review dependencies
        run: box install

      - name: Pin the review formatter runtime
        run: box config set modules.commandbox-boxlang.CLIBoxLangVersion="${BOXLANG_VERSION}"

      - name: Run review checks
        env:
          CI_REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci-review.sh

  dependency_review:
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out dependency manifests
        uses: actions/checkout@v6

      - name: Review pull request dependencies
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate

      - name: Mark dependency review not applicable
        if: github.event_name != 'pull_request'
        run: echo "Dependency diff review applies only to pull requests."

  test:
    name: TestBox
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /app/
            /box.json
            /lib/java/
            /public/
            /runtime/
            /scripts/
            /server.json
            /tests/

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up CommandBox
        uses: Ortus-Solutions/setup-commandbox@v2.0.1
        with:
          version: 6.3.1

      - name: Run TestBox
        env:
          BOXLANG_DEBUG: "false"
          BOX_SERVER_APP_CFENGINE: ${{ env.BOXLANG_CFENGINE }}
          TEST_SERVER_PORT: "8080"
        run: bash scripts/ci-test.sh

  infrastructure:
    name: Validate Azure infrastructure
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out Azure deployment files
        uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /deploy/azure/

      - name: Compile Bicep
        run: az bicep build --file deploy/azure/main.bicep --stdout >/dev/null

  image:
    name: Build OCI image
    needs:
      - quality
      - dependency_review
      - test
      - infrastructure
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.dockerignore
            /Dockerfile
            /app/
            /box.json
            /deploy/
            /lib/java/
            /public/
            /runtime/
            /scripts/
            /server.production.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and optionally publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Smoke-test pull request image
        if: github.event_name == 'pull_request'
        run: bash scripts/container-smoke.sh "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"

  review:
    name: CI review
    if: always() && github.event_name == 'pull_request'
    needs:
      - quality
      - dependency_review
      - test
      - infrastructure
      - image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require every review check
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency_review.result }}
          TEST_RESULT: ${{ needs.test.result }}
          INFRASTRUCTURE_RESULT: ${{ needs.infrastructure.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
        run: |
          failed=0

          for check in \
            "Quality review:${QUALITY_RESULT}" \
            "Dependency review:${DEPENDENCY_RESULT}" \
            "TestBox:${TEST_RESULT}" \
            "Azure infrastructure:${INFRASTRUCTURE_RESULT}" \
            "OCI image smoke:${IMAGE_RESULT}"; do
            name="${check%%:*}"
            result="${check#*:}"
            echo "${name}: ${result}"

            if [[ "${result}" != "success" ]]; then
              failed=1
            fi
          done

          if [[ "${failed}" -ne 0 ]]; then
            echo "One or more required pull request checks did not pass." >&2
            exit 1
          fi

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists."
          else
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
          fi
